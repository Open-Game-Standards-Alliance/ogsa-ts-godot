name: ci
# Verifies the addon end to end via the in-repo testproject: sync the
# addon in, build the C#, run the conformance scene headless — exit 0
# means 13/13 (5 frame conversion + manifest + 7 corpus checks).
# Runs on Windows, Linux, and macOS: sync-addon.ps1 is pure PowerShell
# (no robocopy), run via pwsh on every OS. Corpus found via the standard
# repo checked out as a sibling (ancestor walk).

on: [push, pull_request]

env:
  ORG: Open-Game-Standards-Alliance
  GODOT_VERSION: 4.7.2-stable

jobs:
  notify-dotnet:
    # ogsa-ts-dotnet's own core-drift job checks this repo back and can
    # fail purely from push-order timing if this repo's sync lands after
    # ogsa-ts-dotnet's push — tell it to recheck now that this push
    # landed, so that self-heals without a manual re-run. Needs
    # CROSS_REPO_DISPATCH_TOKEN (a fine-grained PAT scoped to just the
    # Open-Game-Standards-Alliance engine repos, with Contents: Read and
    # write — confirmed by a live 403 "Resource not accessible by
    # personal access token" from this endpoint when that permission was
    # missing; GitHub's own docs don't state it). Skipped entirely (not
    # failed) while unset.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [conformance]
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # the secrets context can't be read directly in an `if:` (GitHub
      # blocks it there); gate through this env var instead
      HAS_DISPATCH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN != '' }}
    steps:
      - name: Dispatch sibling-pushed to ogsa-ts-dotnet
        if: env.HAS_DISPATCH_TOKEN == 'true'
        env:
          TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
        run: |
          status=$(curl -s -o /tmp/dispatch-response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ env.ORG }}/ogsa-ts-dotnet/dispatches" \
            -d "{\"event_type\":\"sibling-pushed\",\"client_payload\":{\"source\":\"${{ github.repository }}\",\"sha\":\"${{ github.sha }}\"}}")
          echo "HTTP status: $status"
          cat /tmp/dispatch-response.json 2>/dev/null || true
          # the response body is GitHub's own error text, never the token
          # (which curl never prints) — safe to show in logs for diagnosis
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "dispatch to ogsa-ts-dotnet failed (see response above)"
            exit 1
          fi

  conformance:
    strategy:
      fail-fast: false
      matrix:
        # godot_asset matches the Godot mono release asset name suffix
        # (Godot_v<version>_mono_<godot_asset>.zip).
        include:
          - os: windows-latest
            godot_asset: win64
          - os: ubuntu-latest
            godot_asset: linux_x86_64
          - os: macos-latest
            godot_asset: macos.universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.ORG }}/OGSA-Telemetry-Standard
          path: OGSA-Telemetry-Standard
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Cache Godot editor
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: godot-editor
          key: godot-${{ env.GODOT_VERSION }}-mono-${{ matrix.godot_asset }}

      - name: Download Godot (mono)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_mono_${{ matrix.godot_asset }}.zip"
          Invoke-WebRequest -Uri $url -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot-editor

      - name: Sync addon into testproject
        shell: pwsh
        run: ./sync-addon.ps1 -Project ./testproject

      - name: Build C# solution
        run: dotnet build testproject/ogsa-ts-godot-testproject.csproj --nologo

      # Windows mono builds ship a *_console.exe (stdout-attached) sibling
      # to the windowed exe; Linux/macOS builds are console-native, so the
      # normal binary is used directly — it just needs the executable bit,
      # which zip extraction on non-Windows platforms doesn't preserve.
      - name: Run conformance scene headless (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Get-ChildItem godot-editor -Filter *_console.exe -Recurse | Select-Object -First 1).FullName
          & $exe --headless --path testproject
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run conformance scene headless (Linux)
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $exe = (Get-ChildItem godot-editor -Recurse -File |
            Where-Object { $_.Name -like 'Godot_*_mono_linux*' -and $_.FullName -notlike '*GodotSharp*' } |
            Select-Object -First 1).FullName
          & chmod +x $exe
          & $exe --headless --path testproject
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run conformance scene headless (macOS)
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $exe = (Get-ChildItem godot-editor -Recurse -File |
            Where-Object { $_.FullName -like '*.app*Contents*MacOS*' } |
            Select-Object -First 1).FullName
          & chmod +x $exe
          & $exe --headless --path testproject
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
